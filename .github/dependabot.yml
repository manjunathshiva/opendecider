version: 2
updates:
  # Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      hf-stack:
        patterns: ["transformers", "huggingface_hub", "safetensors", "peft", "accelerate"]
      serve-stack:
        patterns: ["fastapi", "uvicorn", "httpx"]

  # Base images of the Docker images (python slim, pytorch/pytorch CUDA)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]

  # The Mastra example's npm lockfile
  - package-ecosystem: "npm"
    directory: "/examples/agent_frameworks/mastra"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    groups:
      mastra:
        patterns: ["@mastra/*"]

  # GitHub Actions (see the ignore rules below)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    # GitHub's own actions track floating major tags (actions/checkout@v7, ...), which already receive patches: only
    # majors open a PR. Third-party actions are pinned to a commit (pypa/gh-action-pypi-publish), so those get
    # patch and minor PRs too, or the pin would never pick up a security fix.
    ignore:
      - dependency-name: "actions/*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
      - dependency-name: "github/codeql-action*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
