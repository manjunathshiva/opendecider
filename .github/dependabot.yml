version: 2
updates:
  # Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      hf-stack:
        patterns: ["transformers", "huggingface_hub", "safetensors", "peft", "accelerate"]
      serve-stack:
        patterns: ["fastapi", "uvicorn", "httpx"]

  # Base images of the Docker images (python:3.12-slim, pytorch/pytorch CUDA)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]

  # GitHub Actions: workflows track floating MAJOR tags (actions/checkout@v7, ...), which already receive
  # patches and security fixes, so only majors open a PR (they need a human). Same policy as turboquant-mlx.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]
