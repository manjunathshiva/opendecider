version: 2
updates:
  # Python dependencies declared in pyproject.toml
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    groups:
      hf-stack:
        patterns: ["transformers", "huggingface_hub", "safetensors", "peft", "accelerate"]
      serve-stack:
        patterns: ["fastapi", "uvicorn", "httpx"]

  # Base images of the Docker images (python slim, pytorch/pytorch CUDA)
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]

  # The Mastra example's npm lockfile
  - package-ecosystem: "npm"
    directory: "/examples/agent_frameworks/mastra"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    groups:
      mastra:
        patterns: ["@mastra/*"]

  # @opendecider/client's development dependencies (it has no runtime dependencies). typescript/compat/ is left alone:
  # it pins the oldest supported versions on purpose.
  - package-ecosystem: "npm"
    directory: "/typescript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript"]
    groups:
      typescript-dev:
        patterns: ["*"]

  # GitHub Actions: every action is pinned to a commit (with its version in a comment), so a moved tag cannot change
  # what runs; Dependabot bumps the pins, patches and minors included, or a pin would never pick up a security fix.
  # One grouped PR a week keeps the pins moving together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]
