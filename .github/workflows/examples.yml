name: Examples

# Every script in examples/ against the real opendecider-nano on CPU, so the examples can't silently go stale.
# Runs only when something the examples depend on changes; documentation-only changes skip it (it is not a required
# check, so a skipped run never blocks a merge).

on:
  push:
    branches: [main]
    paths: [opendecider/**, examples/**, packaging/**, pyproject.toml, .github/workflows/examples.yml]
  pull_request:
    paths: [opendecider/**, examples/**, packaging/**, pyproject.toml, .github/workflows/examples.yml]
  workflow_dispatch:

permissions:
  contents: read

env:   # agent frameworks report usage by default; the examples send nothing
  AGNO_TELEMETRY: 'false'
  CREWAI_DISABLE_TELEMETRY: 'true'
  CREWAI_TRACING_ENABLED: 'false'
  OTEL_SDK_DISABLED: 'true'
  PYDANTIC_AI_NO_BANNER: '1'

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[serve,mcp,langchain,llamaindex,agno,agent-framework,google-adk,pydantic-ai,otel]" langgraph pandas pyarrow opentelemetry-sdk
      - run: python -m py_compile examples/*.py examples/agent_frameworks/*.py   # remote_backends.py: compiled only
      - run: python examples/quickstart.py
      - run: python examples/support_triage.py
      - run: python examples/agent_guardrail.py
      - run: python examples/prompt_guard.py --model manjunathshiva/opendecider-nano   # small-td is 4B: too big for CPU CI
      - run: python examples/confident_automation.py --limit 10
      - run: python examples/agent_frameworks/langgraph_router.py
      - run: python examples/agent_frameworks/llamaindex_selector.py
      - run: python examples/agent_frameworks/mcp_client.py
      - run: python examples/agent_frameworks/agno_workflow.py
      - run: python examples/agent_frameworks/agent_framework_workflow.py
      - run: python examples/agent_frameworks/google_adk_router.py
      - run: python examples/agent_frameworks/pydantic_ai_agent.py
      - name: CrewAI and Strands (they pin mcp 1.x, so in a venv layered over the one above)
        run: |
          python -m venv --system-site-packages mcp1
          mcp1/bin/python -m pip install -e ".[crewai,strands]"
          mcp1/bin/python examples/agent_frameworks/crewai_flow.py
          mcp1/bin/python examples/agent_frameworks/crewai_crew.py
          mcp1/bin/python examples/agent_frameworks/strands_agent.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Mastra (TypeScript) through opendecider mcp
        working-directory: examples/agent_frameworks/mastra
        run: npm ci --ignore-scripts --no-audit --no-fund && node index.mjs   # no dependency runs install scripts
      - name: serve_client.py, production_router.py and opendecider-client against opendecider serve
        run: |
          opendecider serve --model manjunathshiva/opendecider-nano > serve.log 2>&1 &
          python examples/serve_client.py --wait 300 || { tail -50 serve.log; exit 1; }
          python examples/production_router.py http://127.0.0.1:8000 --otel || { tail -50 serve.log; exit 1; }
          # opendecider-client, the PyTorch-free package, in a clean environment against the same server
          python -m venv buildenv && buildenv/bin/python -m pip install --require-hashes -r .github/requirements-release.txt
          buildenv/bin/python packaging/build_client.py --outdir client-dist
          python -m venv client && client/bin/python -m pip install client-dist/*.whl
          client/bin/python packaging/check_client.py http://127.0.0.1:8000 || { tail -50 serve.log; exit 1; }
          client/bin/python examples/production_router.py http://127.0.0.1:8000 || { tail -50 serve.log; exit 1; }
