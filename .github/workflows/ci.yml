name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # question/answer logic and the HTTP server (with a fake model) are torch-free; real-model tests run in docker.yml and the release checks
      - run: python -m pip install --no-deps -e . && python -m pip install pytest fastapi httpx
      - run: python -m pytest -q tests

  examples:
    # every script in examples/ against the real opendecider-nano on CPU, so the examples can't silently go stale
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[serve]" pandas pyarrow
      - run: python -m py_compile examples/*.py   # remote_backends.py needs LM Studio, Ollama or vLLM: compiled only
      - run: python examples/quickstart.py
      - run: python examples/support_triage.py
      - run: python examples/agent_guardrail.py
      - run: python examples/confident_automation.py --limit 10
      - name: serve_client.py against opendecider serve
        run: |
          opendecider serve --model manjunathshiva/opendecider-nano > serve.log 2>&1 &
          python examples/serve_client.py --wait 300 || { tail -50 serve.log; exit 1; }
