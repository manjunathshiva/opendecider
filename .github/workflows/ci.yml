name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # the question/answer logic is torch-free; model tests run in the release checks
      - run: python -m pip install --no-deps -e . && python -m pip install pytest
      - run: python -m pytest -q tests
