name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:   # agent frameworks report usage by default; the tests send nothing
  AGNO_TELEMETRY: 'false'
  CREWAI_DISABLE_TELEMETRY: 'true'
  CREWAI_TRACING_ENABLED: 'false'
  OTEL_SDK_DISABLED: 'true'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
        with:
          version: "0.16.10"   # the rules are in pyproject.toml [tool.ruff]

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      # question/answer logic and the HTTP server (with a fake model) are torch-free; real-model tests run in docker.yml and the release checks
      - run: python -m pip install --no-deps -e . && python -m pip install pytest fastapi httpx "mcp>=2.2,<3" langchain-core langgraph llama-index-core agno agent-framework-core google-adk pydantic-ai-slim opentelemetry-sdk uvicorn
      - run: python -m pytest -q tests

  # crewai and strands-agents pin mcp 1.x, which the MCP server cannot use: their integrations get their own environment
  frameworks-mcp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps -e . && python -m pip install pytest crewai strands-agents opentelemetry-sdk
      - run: python -m pytest -q tests/test_frameworks.py tests/test_decisions.py
