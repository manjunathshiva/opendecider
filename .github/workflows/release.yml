name: Release

# Triggered by a tag push (vX.Y.Z). Three jobs:
#   1. release      - create the GitHub Release with auto-generated notes
#   2. build        - build sdist + wheel (pure Python), verify contents and version
#   3. publish-pypi - upload to PyPI via OIDC Trusted Publishing (no API tokens;
#                     the "pypi" environment requires a maintainer's approval)
#
# One-time setup on PyPI (pending publisher, before the first release):
#   https://pypi.org/manage/account/publishing/
#     PyPI project name: opendecider
#     Owner:             manjunathshiva
#     Repository name:   opendecider
#     Workflow filename: release.yml
#     Environment name:  pypi
# One-time setup on GitHub: Settings -> Environments -> "pypi" -> required reviewers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Verify the wheel carries every module
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          need = ["opendecider/__init__.py", "opendecider/questions.py", "opendecider/nano.py",
                  "opendecider/small.py", "opendecider/bench_speed.py", "opendecider/mlx_small.py",
                  "opendecider/serve.py", "opendecider/cli.py", "opendecider/prompt.py", "opendecider/remote.py",
                  "opendecider/mcp_server.py"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"{whl} is missing {missing}")
          print(f"{whl} carries all {len(need)} modules")
          PY
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('opendecider/__init__.py').read()).group(1))")
          TOML=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TOML" ]; then
            echo "Tag v$TAG does not match __version__ $PKG / pyproject $TOML" >&2; exit 1
          fi
          echo "Tag v$TAG matches __version__ and pyproject"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opendecider
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # pinned to a commit: the release/v1 branch can move; Dependabot proposes updates
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
