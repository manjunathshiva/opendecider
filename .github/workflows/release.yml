name: Release

# Triggered by a tag push (vX.Y.Z). The jobs:
#   release      - create the GitHub Release with auto-generated notes
#   build        - build sdist + wheel (pure Python), verify contents and version
#   build-npm    - test, build and pack @opendecider/client (typescript/) and @opendecider/web (web/, which depends on
#                  exactly this version of the client) and verify their versions (stable tags only: a pre-release
#                  tag such as v0.6.0rc1 is not a valid npm version, so it releases Python only)
#   attach       - sign the Python files (Sigstore, build provenance, SBOM) and attach them to the GitHub Release
#   attach-npm   - the same for the npm packages, in its own job so neither side holds up the other
#   publish-pypi - upload to PyPI via OIDC Trusted Publishing (no API tokens;
#                  the "pypi" environment requires a maintainer's approval)
#   publish-npm  - stage both npm packages via OIDC Trusted Publishing, with npm provenance (no tokens; the "npm"
#                  environment requires a maintainer's approval). Staged is not yet public: a maintainer then
#                  publishes each with two-factor authentication, the client first (web depends on it):
#                    npm stage list @opendecider/client && npm stage approve <stage-id>
#                    npm stage list @opendecider/web && npm stage approve <stage-id>
# The build makes two distributions from the same source: opendecider and opendecider-client (no PyTorch,
# packaging/build_client.py). Each PyPI project needs its own trusted publisher, set up as below.
#
# One-time setup on PyPI (pending publisher, before the first release):
#   https://pypi.org/manage/account/publishing/
#     PyPI project name: opendecider   (and again for: opendecider-client)
#     Owner:             manjunathshiva
#     Repository name:   opendecider
#     Workflow filename: release.yml
#     Environment name:  pypi
# One-time setup on npm (trusted publishing can only be added to a package that exists, so the package is first
# published once by hand): npmjs.com -> @opendecider/client (and again for @opendecider/web) -> Settings -> Trusted
# publishing
#     Organization or user: manjunathshiva   Repository: opendecider   Workflow filename: release.yml   Environment: npm
#     Allowed actions: neither "npm publish" nor "npm dist-tag", so CI can only stage a version
# One-time setup on GitHub: Settings -> Environments -> "pypi" and "npm" -> required reviewers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tooling (hash-locked; regenerate with the command in requirements-release.in)
        run: python -m pip install --require-hashes -r .github/requirements-release.txt
      - name: Build
        run: python -m build && python packaging/build_client.py --outdir dist
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Verify the wheel carries every module
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = sorted(glob.glob("dist/*.whl"))
          if [w.split("/")[-1].split("-")[0] for w in wheels] != ["opendecider", "opendecider_client"]:
              sys.exit(f"expected the opendecider and opendecider-client wheels, got {wheels}")
          need = ["opendecider/__init__.py", "opendecider/questions.py", "opendecider/nano.py",
                  "opendecider/small.py", "opendecider/bench_speed.py", "opendecider/mlx_small.py",
                  "opendecider/serve.py", "opendecider/cli.py", "opendecider/prompt.py", "opendecider/remote.py",
                  "opendecider/mcp_server.py", "opendecider/tools.py", "opendecider/guard.py",
                  "opendecider/integrations/__init__.py",
                  "opendecider/integrations/langchain.py", "opendecider/integrations/llamaindex.py",
                  "opendecider/integrations/agno.py", "opendecider/integrations/crewai.py",
                  "opendecider/integrations/agent_framework.py", "opendecider/integrations/google_adk.py",
                  "opendecider/integrations/pydantic_ai.py", "opendecider/integrations/strands.py"]
          for whl in wheels:
              names = set(zipfile.ZipFile(whl).namelist())
              missing = [n for n in need if n not in names]
              if missing:
                  sys.exit(f"{whl} is missing {missing}")
              print(f"{whl} carries all {len(need)} modules")
          PY
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('opendecider/__init__.py').read()).group(1))")
          TOML=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TOML" ]; then
            echo "Tag v$TAG does not match __version__ $PKG / pyproject $TOML" >&2; exit 1
          fi
          echo "Tag v$TAG matches __version__ and pyproject"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  build-npm:
    name: Test, build and pack @opendecider/client and @opendecider/web
    # A pre-release tag (v0.6.0rc1: PEP 440, not a valid npm version; or v1.2.3-preview.1) releases the Python packages only.
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false   # a release builds from the lockfile, never from a cache
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck && npm test
        env:
          MASTRA_TELEMETRY_DISABLED: '1'
      - name: Verify tag matches the package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p 'require("./package.json").version')
          SRC=$(node -p 'require("node:fs").readFileSync("src/version.ts", "utf8").match(/VERSION = "([^"]+)"/)[1]')
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$SRC" ]; then
            echo "Tag v$TAG does not match package.json $PKG / src/version.ts $SRC" >&2; exit 1
          fi
      - name: Build and pack
        run: npm run build && mkdir -p ../npm-dist && npm pack --pack-destination ../npm-dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: "@opendecider/web: the Python package's token ids and prompts, then its tests"
        working-directory: web
        run: |
          python -m pip install "transformers>=5,<6" huggingface_hub
          PYTHONPATH=.. python test/fixtures/make_fixtures.py --check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck && npm test
      - name: "@opendecider/web: verify its version, depend on exactly this client, build and pack"
        working-directory: web
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG does not match web/package.json $PKG" >&2; exit 1; fi
          npm pkg set "dependencies.@opendecider/client=$TAG"   # was the checkout's typescript/ (file:)
          npm run build && npm pack --pack-destination ../npm-dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm
          path: npm-dist/*.tgz
          if-no-files-found: error

  attach:
    name: Sign and attach to the GitHub Release
    # Apart from the publish jobs, so a signing problem never holds up a release; the npm package is signed in its
    # own job, so a problem on the npm side never holds up the Python files either.
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the release assets
      id-token: write       # Sigstore keyless signing
      attestations: write   # GitHub build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Build provenance (verify with `gh attestation verify <file> --repo manjunathshiva/opendecider`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Sigstore signatures (<file>.sigstore.json)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          release-signing-artifacts: false   # attached below with the rest
      - name: Collect what the SBOM covers (the wheel and the hash-locked dependencies of the CPU image)
        run: mkdir sbom-src && cp dist/*.whl docker/requirements-cpu.txt sbom-src/
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          path: sbom-src
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp sbom.spdx.json "opendecider-${TAG#v}.spdx.json"
          gh release upload "$TAG" dist/* "opendecider-${TAG#v}.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"

  attach-npm:
    name: Sign and attach the npm packages to the GitHub Release
    needs: [release, build-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the release assets
      id-token: write       # Sigstore keyless signing
      attestations: write   # GitHub build provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm
          path: npm-dist/
      - name: Build provenance (verify with `gh attestation verify <file> --repo manjunathshiva/opendecider`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: npm-dist/*.tgz
      - name: Sigstore signature (<file>.sigstore.json)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: npm-dist/*.tgz
          release-signing-artifacts: false   # attached below
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" npm-dist/* --clobber --repo "$GITHUB_REPOSITORY"

  build-extension:
    name: Test and build OpenDecider Focus (the Chrome extension)
    # Its own job, so a problem with the extension never holds up the npm or Python releases.
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false   # a release builds from the lockfile, never from a cache
      - name: Build @opendecider/client and @opendecider/web (the extension bundles this checkout's)
        run: |
          (cd typescript && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          (cd web && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
      - name: Verify its version, test it, build the Web Store zip
        working-directory: extension
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "$PKG" ]; then echo "Tag v$TAG does not match extension/package.json $PKG" >&2; exit 1; fi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck && npm test
          npm run zip && node scripts/check-package.mjs
          mkdir -p ../extension-dist && cp "opendecider-focus-$TAG.zip" ../extension-dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: extension
          path: extension-dist/*.zip
          if-no-files-found: error

  attach-extension:
    name: Sign and attach the Chrome extension to the GitHub Release
    needs: [release, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the release assets
      id-token: write       # Sigstore keyless signing
      attestations: write   # GitHub build provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: extension
          path: extension-dist/
      - name: Build provenance (verify with `gh attestation verify <file> --repo manjunathshiva/opendecider`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: extension-dist/*.zip
      - name: Sigstore signature (<file>.sigstore.json)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: extension-dist/*.zip
          release-signing-artifacts: false   # attached below
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF#refs/tags/}" extension-dist/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opendecider
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # pinned to a commit: the release/v1 branch can move; Dependabot proposes updates
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true

  publish-npm:
    name: Publish the npm packages to npm (OIDC)
    needs: build-npm
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@opendecider/client
    permissions:
      id-token: write   # trusted publishing; npm adds the provenance attestation
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm
          path: npm-dist/
      - name: Stage (each one skipped when its version is already on npm; a re-run stages it again, so reject the extra one)
        run: |
          # shellcheck disable=SC2016  # the ${...} in single quotes are JavaScript template literals
          node -e 'const [maj, min] = process.argv[1].split(".").map(Number);
                   if (maj < 11 || (maj === 11 && min < 15)) {
                     console.error(`staged publishing needs npm 11.15.0 or later, this is ${process.argv[1]}`); process.exit(1); }' "$(npm --version)"
          for TGZ in ./npm-dist/opendecider-client-*.tgz ./npm-dist/opendecider-web-*.tgz; do   # (./: npm reads "dir/file.tgz" as a GitHub repository)
            # shellcheck disable=SC2016  # (as above)
            NAME=$(tar -xOzf "$TGZ" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0)); `${p.name}@${p.version}`')
            # (by its output: some npm versions print nothing, and succeed, for a version that does not exist)
            if [ -n "$(npm view "$NAME" version 2>/dev/null)" ]; then echo "$NAME is already on npm"; continue; fi
            npm stage publish "$TGZ" --access public --provenance
            echo "::notice title=npm::$NAME is staged, not yet public. Publish it with two-factor authentication: npm stage list ${NAME%@*}, then npm stage approve <stage-id>"
          done
