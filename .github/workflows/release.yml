name: Release

# Triggered by a tag push (vX.Y.Z). Three jobs:
#   1. release      - create the GitHub Release with auto-generated notes
#   2. build        - build sdist + wheel (pure Python), verify contents and version
#   3. publish-pypi - upload to PyPI via OIDC Trusted Publishing (no API tokens;
#                     the "pypi" environment requires a maintainer's approval)
#
# One-time setup on PyPI (pending publisher, before the first release):
#   https://pypi.org/manage/account/publishing/
#     PyPI project name: opendecider
#     Owner:             manjunathshiva
#     Repository name:   opendecider
#     Workflow filename: release.yml
#     Environment name:  pypi
# One-time setup on GitHub: Settings -> Environments -> "pypi" -> required reviewers.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag

  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install build tooling (hash-locked; regenerate with the command in requirements-release.in)
        run: python -m pip install --require-hashes -r .github/requirements-release.txt
      - name: Build
        run: python -m build
      - name: Check distribution metadata
        run: twine check dist/*
      - name: Verify the wheel carries every module
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          need = ["opendecider/__init__.py", "opendecider/questions.py", "opendecider/nano.py",
                  "opendecider/small.py", "opendecider/bench_speed.py", "opendecider/mlx_small.py",
                  "opendecider/serve.py", "opendecider/cli.py", "opendecider/prompt.py", "opendecider/remote.py",
                  "opendecider/mcp_server.py", "opendecider/tools.py", "opendecider/integrations/__init__.py",
                  "opendecider/integrations/langchain.py", "opendecider/integrations/llamaindex.py",
                  "opendecider/integrations/agno.py", "opendecider/integrations/crewai.py",
                  "opendecider/integrations/agent_framework.py", "opendecider/integrations/google_adk.py",
                  "opendecider/integrations/pydantic_ai.py", "opendecider/integrations/strands.py"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"{whl} is missing {missing}")
          print(f"{whl} carries all {len(need)} modules")
          PY
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('opendecider/__init__.py').read()).group(1))")
          TOML=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$TOML" ]; then
            echo "Tag v$TAG does not match __version__ $PKG / pyproject $TOML" >&2; exit 1
          fi
          echo "Tag v$TAG matches __version__ and pyproject"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  attach:
    name: Sign and attach to the GitHub Release
    # Apart from publish-pypi, so a signing problem never holds up the PyPI release.
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # upload the release assets
      id-token: write       # Sigstore keyless signing
      attestations: write   # GitHub build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Build provenance (verify with `gh attestation verify <file> --repo manjunathshiva/opendecider`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Sigstore signatures (<file>.sigstore.json)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz
          release-signing-artifacts: false   # attached below with the rest
      - name: Collect what the SBOM covers (the wheel and the hash-locked dependencies of the CPU image)
        run: mkdir sbom-src && cp dist/*.whl docker/requirements-cpu.txt sbom-src/
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          path: sbom-src
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp sbom.spdx.json "opendecider-${TAG#v}.spdx.json"
          gh release upload "$TAG" dist/* "opendecider-${TAG#v}.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/opendecider
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      # pinned to a commit: the release/v1 branch can move; Dependabot proposes updates
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33   # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true
