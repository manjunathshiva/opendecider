name: Docker

# PRs and main: build the CPU image and smoke-test it for real (start the container, wait for /ready,
# answer a Jev-format request with opendecider-nano). Tags (vX.Y.Z): also publish both images to GHCR:
#   ghcr.io/<owner>/opendecider:<version> and :latest          (CPU)
#   ghcr.io/<owner>/opendecider:<version>-cuda and :latest-cuda (NVIDIA)
# and sign each with cosign (keyless, Sigstore), with an SBOM and build provenance attested in the registry:
#   cosign verify ghcr.io/manjunathshiva/opendecider:<version> \
#     --certificate-identity-regexp '^https://github.com/manjunathshiva/opendecider/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   gh attestation verify oci://ghcr.io/manjunathshiva/opendecider:<version> --repo manjunathshiva/opendecider

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # publish to GHCR (tags only)
      id-token: write       # keyless signing (tags only)
      attestations: write   # SBOM and build provenance (tags only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the CPU image
        run: docker build -f docker/Dockerfile -t opendecider:ci .
      - name: Smoke test (nano, Jev wire format, auth)
        run: |
          docker run -d --name od -p 8000:8000 -e OPENDECIDER_API_KEY=ci-key opendecider:ci
          for i in $(seq 1 90); do curl -sf localhost:8000/ready && break; sleep 4; done
          curl -sf localhost:8000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/systemone -H 'content-type: application/json' -d '{"state":"x","questions":{"q":{"type":"noul","instructions":"?"}}}')
          test "$code" = 401
          curl -sf -X POST localhost:8000/v1/systemone -H 'content-type: application/json' -H 'Authorization: Bearer ci-key' \
            -d '{"model":"jev-latest","state":"Hi, we were billed twice for March. Please refund the duplicate today.","questions":{"department":{"type":"choice","instructions":"Which department should handle this?","criteria":{"billing":"invoices, payments, refunds","technical":"bugs, outages"}},"urgency":{"type":"score","instructions":"How urgent?","criteria":["not urgent","soon","blocking"]},"refund":{"type":"noul","instructions":"Does the customer ask for a refund?"}}}' \
            | tee out.json
          python3 -c "import json; b=json.load(open('out.json')); a=b['answers']; assert a['department']['choice']=='billing', a; assert a['refund']['noul']>0.5, a; assert 'legend' in a['urgency'] and b['usage']['input_tokens']>0; print('smoke test OK')"
          docker logs od | tail -20
      - name: Publish to GHCR (tags only)
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          V="${GITHUB_REF#refs/tags/v}"; IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opendecider"
          docker tag opendecider:ci "$IMG:$V" && docker tag opendecider:ci "$IMG:latest"
          docker push "$IMG:$V" && docker push "$IMG:latest"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG:$V" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign the image (cosign, keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM (SPDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  cuda:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # publish to GHCR (tags only)
      id-token: write       # keyless signing (tags only)
      attestations: write   # SBOM and build provenance (tags only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc && df -h /
      - name: Build the CUDA image (no GPU on CI runners; the image is exercised on AWS before a release)
        run: docker build -f docker/Dockerfile.cuda -t opendecider:ci-cuda .
      - name: Check the entry point imports
        run: docker run --rm --entrypoint python3 opendecider:ci-cuda -c "import torch, opendecider.serve, opendecider.cli, fastapi, uvicorn, peft; print('torch', torch.__version__, 'cuda build', torch.version.cuda)"
      - name: Publish to GHCR (tags only)
        id: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          V="${GITHUB_REF#refs/tags/v}"; IMG="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opendecider"
          docker tag opendecider:ci-cuda "$IMG:$V-cuda" && docker tag opendecider:ci-cuda "$IMG:latest-cuda"
          docker push "$IMG:$V-cuda" && docker push "$IMG:latest-cuda"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMG:$V-cuda" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Sign the image (cosign, keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: SBOM (SPDX)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          image: ${{ steps.publish.outputs.image }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        # the CUDA image's SBOM can pass the attestation's 16 MB limit; the image is already pushed and signed by now
        continue-on-error: true
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Attest the build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
