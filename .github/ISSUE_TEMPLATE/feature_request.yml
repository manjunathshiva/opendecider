name: Feature request
description: Suggest a new feature, integration or improvement.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The behaviour or API you have in mind. A short code sketch helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself.
