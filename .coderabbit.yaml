# CodeRabbit review settings (https://docs.coderabbit.ai/getting-started/configure-coderabbit)
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!benchmarks/results/**"
    - "!assets/**"
    - "!**/*.ipynb"
  path_instructions:
    - path: "opendecider/serve.py"
      instructions: >-
        The server must stay wire-compatible with TypeSafe Jev's /v1/systemone protocol (request
        {model?, state, questions}; response {model, answers, usage}; a score answer's `score` is the
        expected score). Check: auth comparisons stay constant-time, every limit returns a 4xx with a
        message, server errors never return tracebacks or paths, and nothing blocks the event loop.
    - path: "opendecider/{nano,small,mlx_small,questions}.py"
      instructions: >-
        Any change to how inputs are rendered, tokenised or scored changes the published benchmark
        numbers. Flag such changes unless the PR includes before/after results from benchmarks/.
    - path: "docker/**"
      instructions: "Images run as a non-root user; flag anything that runs as root or bakes secrets into layers."
