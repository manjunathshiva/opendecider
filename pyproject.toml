[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opendecider"
version = "0.1.2"
description = "Small open decision models (System One): typed choice / score / yes-no questions with calibrated probabilities. Runs on CPU, NVIDIA and Apple Silicon."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Manjunath Janardhan" }]
keywords = ["decision model", "system one", "classification", "calibration", "typed decisions", "jev", "laya"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "safetensors>=0.4",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
# opendecider-small is a LoRA adapter on Qwen3-4B-Instruct-2507
small = ["peft>=0.11", "accelerate"]
# opendecider-small-mlx-*: Apple Silicon builds run through MLX
mlx = ["mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/manjunathshiva/opendecider"
Models = "https://huggingface.co/manjunathshiva/opendecider-nano"

[tool.setuptools]
packages = ["opendecider"]
